name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure git user and amend latest commit
        run: |
          git config --global user.name "techtpnexa"
          git config --global user.email "tech.tpnexa@gmail.com"
          git commit --amend --author="techtpnexa <tech.tpnexa@gmail.com>" --no-edit
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: cd apps/web && npm ci && npm install
        
      - name: Build project
        run: cd apps/web && npm run build
        
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🚀 Deploying preview from $(pwd)"
          vercel --token=${{ secrets.VERCEL_TOKEN_PC }} --yes --scope=${{ secrets.VERCEL_ORG_ID }}
          
      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🚀 Deploying production from $(pwd)"
          echo "📁 Directory contents:"
          ls -la
          vercel --prod --token=${{ secrets.VERCEL_TOKEN_PC }} --yes --scope=${{ secrets.VERCEL_ORG_ID }}